version: '3.8'

services:
  api:
    build:
      context: ./recipe_api
      dockerfile: Dockerfile
    container_name: recipe_api
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/recipes.db
    volumes:
      - recipe_data:/app/data
    networks:
      - recipe_net

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: recipe_web
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:80"
    depends_on:
      - api
    networks:
      - recipe_net

volumes:
  recipe_data:
    name: recipe_data

networks:
  recipe_net:
    driver: bridge
