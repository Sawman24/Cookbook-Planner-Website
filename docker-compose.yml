version: '3.8'

services:
  api:
    build:
      context: ./recipe_api
      dockerfile: Dockerfile
    container_name: recipe_api
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/recipes.db
    volumes:
      - recipe_data:/app/data
    networks:
      - recipe_net

  web:
    image: nginx:alpine
    container_name: recipe_web
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:80"
    volumes:
      - ./www/html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - recipe_net

volumes:
  recipe_data:
    name: recipe_data

networks:
  recipe_net:
    driver: bridge
